<style>
/* Layout: one stage, card centered, controls in a quiet bar beneath. */
:root {
  --bg: #eef3f7;
  --stage-a: #f8fbfd;
  --stage-b: #dde8f0;
  --fg: #0b2236;
  --muted: #5a6d80;
  --accent: #11a9d6;
  --line: #cfdbe5;
  --btn: #ffffff;
  --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060d16; --stage-a: #13263a; --stage-b: #070f19; --fg: #e6eef5;
    --muted: #8ea3b6; --accent: #2cc3ee; --line: #1d3247; --btn: #0e1d2c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060d16; --stage-a: #13263a; --stage-b: #070f19; --fg: #e6eef5;
  --muted: #8ea3b6; --accent: #2cc3ee; --line: #1d3247; --btn: #0e1d2c; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box; gap: 14px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; max-width: 960px; width: 100%; margin-inline: auto; }
header h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
header p { margin: 0; font-size: 13px; color: var(--muted); }
.stage {
  position: relative; flex: 1; min-height: 420px; max-width: 960px; width: 100%; margin-inline: auto;
  border-radius: 20px; overflow: hidden;
  background: radial-gradient(110% 80% at 50% 35%, var(--stage-a) 0%, var(--stage-b) 100%);
  border: 1px solid var(--line);
  touch-action: none; cursor: grab;
}
.stage:active { cursor: grabbing; }
canvas { display: block; width: 100%; height: 100%; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 960px; width: 100%; margin-inline: auto; }
.controls button {
  font: 600 13px/1 var(--font); letter-spacing: 0.04em;
  padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--btn); color: var(--fg); cursor: pointer;
}
.controls button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #04121c; }
.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { position: absolute; left: 16px; bottom: 14px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
</style>

<header>
  <h1>Carte YOQO Platinum</h1>
  <p>Glissez pour tourner la carte</p>
</header>

  <button type="button" id="b-back" aria-pressed="false">Face arrière</button>
</div>

(function () {
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
    renderer.shadowMap.enabled = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 7.8);

  // Lights: soft key, cool rim, fill
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.45));
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(3, 4, 6); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fe4ff, 0.7); rim.position.set(-5, 2, -4); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-3, -2, 5); scene.add(fill);

  // Simple studio environment for reflections
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = new THREE.Scene();
  const envGeo = new THREE.SphereGeometry(10, 32, 16);
  const envMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vP; void main(){ float t = vP.y*0.5+0.5; vec3 c = mix(vec3(0.05,0.07,0.1), vec3(0.95), smoothstep(0.35,0.95,t)); float strip = smoothstep(0.12,0.0,abs(vP.x-0.3)) * smoothstep(-0.2,0.6,vP.y); c += vec3(1.2)*strip; gl_FragColor = vec4(c,1.0); }'
  });
  envScene.add(new THREE.Mesh(envGeo, envMat));
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;

  // Card dimensions (portrait), proportions from the artwork
  const W = 2.0, H = W * (1062 / 640), T = 0.03, R = W * 0.085;
  function roundedRect(w, h, r) {
    const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  const shape = roundedRect(W, H, R);

  function faceGeometry(mirror) {
    const g = new THREE.ShapeGeometry(shape, 24);
    const pos = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const u = (pos.getX(i) + W / 2) / W, v = (pos.getY(i) + H / 2) / H;
      uv.setXY(i, mirror ? 1 - u : u, v);
    }
    uv.needsUpdate = true;
    return g;
  }

  const loader = new THREE.TextureLoader();
  function tex(src) {
    const t = loader.load(src);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  const faceMat = (map) => new THREE.MeshPhysicalMaterial({
    map, roughness: 0.6, metalness: 0.0, clearcoat: 0.15, clearcoatRoughness: 0.4, envMapIntensity: 0.06, specularIntensity: 0.35
  });

  const card = new THREE.Group();
  const front = new THREE.Mesh(faceGeometry(false), faceMat(tex(FRONT)));
  front.position.z = T / 2 + 0.0005;
  const back = new THREE.Mesh(faceGeometry(false), faceMat(tex(BACK)));
  back.rotation.y = Math.PI; back.position.z = -T / 2 - 0.0005;
  const edge = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false, curveSegments: 24 }),
    new THREE.MeshPhysicalMaterial({ color: 0x0a1626, roughness: 0.35, clearcoat: 0.4, envMapIntensity: 0.8 })
  );
  edge.position.z = -T / 2;
  card.add(edge, front, back);
  scene.add(card);

  // Soft contact shadow
  const shadowCanvas = document.createElement('canvas'); shadowCanvas.width = shadowCanvas.height = 128;
  const sc = shadowCanvas.getContext('2d');
  const grd = sc.createRadialGradient(64, 64, 4, 64, 64, 64);
  grd.addColorStop(0, 'rgba(0,0,0,0.35)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  sc.fillStyle = grd; sc.fillRect(0, 0, 128, 128);
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false }));
  shadow.position.set(0, -H / 2 - 0.45, -0.3); shadow.rotation.x = -Math.PI / 2.4;
  scene.add(shadow);

  // Interaction
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let mode = reduce ? 'front' : 'auto';
  const Z_BACK = Math.PI / 2;
  let targetZ = 0, rotZ = 0, targetY = 0, targetX = 0, rotY = -0.35, rotX = 0.08, velY = 0, dragging = false, lastX = 0, lastY = 0, idleUntil = 0;

  const btns = { auto: document.getElementById('b-auto'), front: document.getElementById('b-front'), back: document.getElementById('b-back') };
  function setMode(m) {
    mode = m;
    Object.entries(btns).forEach(([k, b]) => b.setAttribute('aria-pressed', String(k === m)));
    if (m === 'auto') { targetZ = 0; }
    if (m === 'front') { targetY = nearest(rotY, 0); targetX = 0.06; targetZ = 0; }
    if (m === 'back') { targetY = nearest(rotY, Math.PI); targetX = 0; targetZ = Z_BACK; }
  }
  function nearest(cur, base) { const k = Math.round((cur - base) / (2 * Math.PI)); return base + k * 2 * Math.PI; }
  btns.auto.onclick = () => setMode('auto');
  btns.front.onclick = () => setMode('front');
  btns.back.onclick = () => setMode('back');
  setMode(mode);

  stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; velY = 0; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    rotY += dx * 0.01; rotX = Math.max(-0.6, Math.min(0.6, rotX + dy * 0.006)); velY = dx * 0.01;
  });
  const end = () => {
    if (!dragging) return; dragging = false; idleUntil = performance.now() + 2500;
    if (mode !== 'auto') { targetY = nearest(rotY, mode === 'back' ? Math.PI : 0); }
  };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  function resize() {
    const r = stage.getBoundingClientRect();
    renderer.setSize(r.width, r.height, false);
    camera.aspect = r.width / r.height;
    // keep the whole card in view on narrow screens
    camera.position.z = camera.aspect < 0.8 ? 9.6 : 7.8;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  const clock = new THREE.Clock();
  function tick() {
    const t = clock.getElapsedTime();
    if (!dragging) {
      if (mode === 'auto' && performance.now() > idleUntil) {
        velY += (0.006 - velY) * 0.03; rotY += velY;
        rotX += (0.12 * Math.sin(t * 0.6) - rotX) * 0.03;
      } else if (mode === 'auto') {
        velY *= 0.95; rotY += velY;
      } else {
        rotY += (targetY - rotY) * 0.08; rotX += (targetX - rotX) * 0.08;
      }
    }
    rotZ += (targetZ - rotZ) * 0.08;
    card.rotation.set(rotX, rotY, rotZ + (mode === 'auto' && !reduce ? 0.05 * Math.sin(t * 0.8) : 0));
    card.position.y = reduce ? 0 : 0.06 * Math.sin(t * 1.2);
    shadow.material.opacity = 0.9 - card.position.y * 2;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
